apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-project
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/Nevrik-core/aiops-quality-project.git
    targetRevision: final-project
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
