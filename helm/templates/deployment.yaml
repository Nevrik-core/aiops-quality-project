apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-quality-project.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aiops-quality-project.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "aiops-quality-project.name" . }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: {{ .Values.env.MODEL_PATH | quote }}
            - name: DRIFT_THRESHOLD
              value: {{ .Values.env.DRIFT_THRESHOLD | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}