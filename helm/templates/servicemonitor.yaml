{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aiops-quality-project.fullname" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "aiops-quality-project.name" . }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.scrapePath }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}